<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PeoplePulse · HR analytics</title><link rel="stylesheet" href="style.css"></head><body><header><div><span class="eyebrow">PEOPLEPULSE</span><h1>HR data, made clear.</h1><p>Explore workforce trends and make confident people decisions.</p></div><button id="reset" class="ghost">↺ Reset sample</button></header><main><section class="toolbar"><label class="upload">＋ Import CSV / JSON<input id="file" type="file" accept=".csv,.json"></label><div class="exports"><button data-export="csv">CSV</button><button data-export="json">JSON</button><button data-export="html">HTML</button></div><span id="notice"></span></section><section class="filters"><input id="search" placeholder="Search people, roles…"><select id="department"><option value="">All departments</option></select><select id="location"><option value="">All locations</option></select><select id="employmentType"><option value="">All employment types</option></select><select id="active"><option value="">Any status</option><option value="true">Active</option><option value="false">Inactive</option></select></section><section class="cards"><article><span>Total people</span><strong id="total">—</strong></article><article><span>Active</span><strong id="activeCount">—</strong><small id="activeRate"></small></article><article><span>Average salary</span><strong id="avgSalary">—</strong></article><article><span>Avg. performance</span><strong id="avgPerf">—</strong></article></section><section class="grid"><article class="panel"><h2>Headcount by department</h2><div id="departments" class="bars"></div></article><article class="panel"><h2>Where people work</h2><div id="locations" class="bars"></div></article></section><section class="panel"><div class="table-head"><h2>Employee directory</h2><span id="count"></span></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Department</th><th>Role</th><th>Location</th><th>Salary</th><th>Performance</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="app.js"></script></body></html>
